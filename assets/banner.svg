<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="purpleNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928CA"/>
      <stop offset="100%" stop-color="#FF0080"/>
    </linearGradient>

    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00DFD8"/>
      <stop offset="100%" stop-color="#007CF0"/>
    </linearGradient>

    <!-- Animated Pulse FX -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Card -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" stroke="#30363d" stroke-width="2"/>

  <!-- Dynamic / Animated Background Wave Elements -->
  <g opacity="0.25">
    <path d="M-100,180 Q200,60 500,220 T1100,100 T1400,250" fill="none" stroke="url(#cyanNeon)" stroke-width="4">
      <animate attributeName="d" dur="8s" repeatCount="indefinite"
        values="M-100,180 Q200,60 500,220 T1100,100 T1400,250;
                M-100,220 Q200,120 500,140 T1100,220 T1400,150;
                M-100,180 Q200,60 500,220 T1100,100 T1400,250" />
    </path>
    <path d="M-50,260 Q350,100 700,280 T1300,140" fill="none" stroke="url(#purpleNeon)" stroke-width="3">
      <animate attributeName="d" dur="10s" repeatCount="indefinite"
        values="M-50,260 Q350,100 700,280 T1300,140;
                M-50,160 Q350,240 700,160 T1300,260;
                M-50,260 Q350,100 700,280 T1300,140" />
    </path>
  </g>

  <!-- Grid Pattern overlay -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.04">
    <path d="M 0 60 L 1200 60 M 0 120 L 1200 120 M 0 180 L 1200 180 M 0 240 L 1200 240 M 0 300 L 1200 300" />
    <path d="M 120 0 L 120 360 M 240 0 L 240 360 M 360 0 L 360 360 M 480 0 L 480 360 M 600 0 L 600 360 M 720 0 L 720 360 M 840 0 L 840 360 M 960 0 L 960 360 M 1080 0 L 1080 360" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="90" r="140" fill="#7928CA" opacity="0.15" filter="url(#glow)"/>
  <circle cx="1050" cy="270" r="160" fill="#007CF0" opacity="0.15" filter="url(#glow)"/>

  <!-- Foreground Title and Subtitle -->
  <g transform="translate(80, 115)">
    <!-- Top Pill Badge -->
    <rect x="0" y="0" width="220" height="32" rx="16" fill="#1f242d" stroke="#30363d" stroke-width="1.5"/>
    <text x="16" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#00DFD8">
      🎮 CLOUD GAMING STACK
    </text>

    <!-- Main Title -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Awesome Cloud Gaming Platform
    </text>

    <!-- Subtitle -->
    <text x="0" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#8b949e">
      Curated SaaS Platforms, Low-Latency WebRTC &amp; Self-Hosted Streaming Infrastructure
    </text>
  </g>

  <!-- Bottom Interactive / Dynamic Metric Tags -->
  <g transform="translate(80, 280)">
    <rect x="0" y="0" width="160" height="36" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="16" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#e6edf3">⚡ Low-Latency</text>

    <rect x="175" y="0" width="160" height="36" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="191" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#e6edf3">🌐 WebRTC &amp; GPU</text>

    <rect x="350" y="0" width="170" height="36" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="366" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#e6edf3">🔓 Open-Source</text>
  </g>
</svg>
